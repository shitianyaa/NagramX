name: Staging Build

on:
  push:
    branches:
      - dev
    paths:
      - 'gradle.properties'
      - 'TMessagesProj/build.gradle'
      - 'TMessagesProj/google-services.json'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_change.outputs.changed }}
      publish: ${{ steps.version_change.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version fields
        id: version_change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish_release }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 "$AFTER_SHA")
          fi

          if git diff --unified=0 "$BEFORE_SHA" "$AFTER_SHA" -- gradle.properties TMessagesProj/build.gradle TMessagesProj/google-services.json |
            grep -E '^[+-].*(APP_VERSION_(NAME|CODE)|APP_PACKAGE|package_name|def verCode[[:space:]]*=|version(Name|Code)[[:space:]])'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Staging APK
    needs: check_version
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Read build version
        id: version
        run: |
          version_name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | head -n 1)
          version_code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | head -n 1)
          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::Unable to read release version"
            exit 1
          fi
          echo "artifact_name=NagramX-${version_name}-${version_code}-staging" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Restore release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore

      - name: Tune Gradle memory
        run: |
          memory_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          memory_gb=$((memory_kb / 1024 / 1024))
          echo "Detected memory size: ${memory_gb}GB"
          if [[ $memory_gb -ge 12 ]]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Build Staging APK
        env:
          COMMIT_ID: ${{ github.sha }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleStaging

      - name: Verify and checksum APK
        id: package
        run: bash .github/scripts/prepare-apk.sh TMessagesProj/build/outputs/apk/staging commit-suffixed

      - name: Upload Staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Prerelease
    needs: [check_version, build]
    if: needs.check_version.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release version
        id: version
        run: |
          version_name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | head -n 1)
          version_code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | head -n 1)
          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::Unable to read release version"
            exit 1
          fi
          echo "tag=v${version_name}-${version_code}-staging" >> "$GITHUB_OUTPUT"
          echo "title=NagramX ${version_name} (${version_code}) Staging" >> "$GITHUB_OUTPUT"
          echo "notes=release-notes/v${version_name}-${version_code}.md" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          CURATED_NOTES: ${{ steps.version.outputs.notes }}
          RELEASE_CHANNEL: staging
        run: |
          if [[ -s "$CURATED_NOTES" ]]; then
            cp "$CURATED_NOTES" release-notes/notes.md
          else
            bash .github/scripts/generate-changelog.sh release-notes/notes.md
          fi
          cat release-notes/notes.md

      - name: Download Staging artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes/notes.md --prerelease
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes/notes.md \
              --prerelease
          fi
